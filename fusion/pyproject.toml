[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dms-fusion"
version = "0.1.0"
description = "DMS decision fusion stub — models report, fusion alerts."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/dms_fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
