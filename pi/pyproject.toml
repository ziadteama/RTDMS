[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rtdms-pi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["dms-fusion"]

[project.optional-dependencies]
pi = ["gpiozero"]
ble = ["bless>=0.2.6,<0.3", "bleak"]
qr = ["qrcode"]
dev = ["qrcode", "pytest", "pytest-asyncio", "ruff", "mypy", "jsonschema", "types-jsonschema"]

[project.scripts]
rtdms-pi = "rtdms_pi.main:main"
rtdms-pair = "rtdms_pi.pairing:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rtdms_pi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
follow_untyped_imports = true

# Preserve fusion signatures while checking only this package, not upstream internals.
[[tool.mypy.overrides]]
module = ["dms_fusion"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["qrcode", "qrcode.*"]
follow_untyped_imports = false
ignore_missing_imports = true
